services:
  coupon-api:
    build: .
    image: coupon-api:latest
    container_name: coupon-api
    ports:
      # Porta do host configurável: APP_PORT=8097 docker compose up
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/v3/api-docs"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped
